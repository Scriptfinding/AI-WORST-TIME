name: 'CI: CLA Check'

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Verify CLA signature
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
         github.event.comment.body == 'recheck'))
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/puppetflow/puppetflow/blob/master/CONTRIBUTOR_LICENSE_AGREEMENT.md'
          path-to-signatures: '.github/cla-signatures.json'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge it, you need to sign our
            [Contributor License Agreement](https://github.com/puppetflow/puppetflow/blob/master/CONTRIBUTOR_LICENSE_AGREEMENT.md).
            You can do so by posting the comment below, exactly as written.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: false
