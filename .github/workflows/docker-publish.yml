name: Build & Push to GHCR

on:
  push:
    branches:
      - master
    paths:
      - 'version.txt'
      - 'enforce.txt'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            architecture: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app by digest
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.architecture }}
          cache-to: type=gha,scope=app-${{ matrix.architecture }},mode=max

      - name: Build and push stream server by digest
        id: stream
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.stream-server
          target: prod
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stream-server-${{ matrix.architecture }}
          cache-to: type=gha,scope=stream-server-${{ matrix.architecture }},mode=max

      - name: Export digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          STREAM_DIGEST: ${{ steps.stream.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/app /tmp/digests/stream
          touch "/tmp/digests/app/${APP_DIGEST#sha256:}"
          touch "/tmp/digests/stream/${STREAM_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  merge-and-push:
    needs: build-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "value=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifests
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          app_image="${REGISTRY}/${IMAGE_NAME}"
          stream_image="${app_image}-stream-server"
          app_sources=()
          stream_sources=()

          for digest in /tmp/digests/app/*; do
            app_sources+=("${app_image}@sha256:$(basename "$digest")")
          done

          for digest in /tmp/digests/stream/*; do
            stream_sources+=("${stream_image}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create \
            --tag "${app_image}:latest" \
            --tag "${app_image}:v${VERSION}" \
            --tag "${app_image}:${GITHUB_SHA}" \
            "${app_sources[@]}"

          docker buildx imagetools create \
            --tag "${stream_image}:latest" \
            --tag "${stream_image}:v${VERSION}" \
            --tag "${stream_image}:${GITHUB_SHA}" \
            "${stream_sources[@]}"

  release:
    needs: merge-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "value=$(cat version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.value }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream-server:v${{ steps.version.outputs.value }}
            ```
