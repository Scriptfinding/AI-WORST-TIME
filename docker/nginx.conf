server {
    listen 8000;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;

    client_max_body_size 64M;
    client_body_buffer_size 128k;

    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── Gzip ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Vite assets (content-hashed filenames → immutable cache) ──
    # location /build/ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }

    # ── Static files ──
    # location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff2?|ttf|eot|svg|webp|avif)$ {
    #     expires 7d;
    #     add_header Cache-Control "public";
    #     access_log off;
    #     try_files $uri =404;
    # }

    # ── Laravel front controller ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ── PHP-FPM via FastCGI ──
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # ── Block dotfiles (except .well-known) ──
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
