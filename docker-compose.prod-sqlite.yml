services:
  # ── App (nginx + php-fpm via supervisor) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - puppetflow-framework:/app/storage
      - puppetflow-execution:/app/data/execution
      - puppetflow-uploads:/app/data/storage
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      pinokio:
        condition: service_started
      stream-server:
        condition: service_started

  # ── Queue worker 1 ──
  queue-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=1", "--tries=1", "--timeout=630", "--sleep=3", "--max-jobs=500", "--max-time=3600"]
    deploy:
      replicas: 1
    volumes:
      - puppetflow-framework:/app/storage
      - puppetflow-execution:/app/data/execution
      - puppetflow-uploads:/app/data/storage
    env_file:
      - .env
    environment:
      BROWSER_STREAM_INTERNAL_URL: "http://stream-server:6080"
      RUNNER_API_INTERNAL_URL: "http://app:8000/api/internal/runner"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      stream-server:
        condition: service_started

  # ── Queue worker 2 ──
  queue-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=2", "--tries=1", "--timeout=630", "--sleep=3", "--max-jobs=500", "--max-time=3600"]
    deploy:
      replicas: 1
    volumes:
      - puppetflow-framework:/app/storage
      - puppetflow-execution:/app/data/execution
      - puppetflow-uploads:/app/data/storage
    env_file:
      - .env
    environment:
      BROWSER_STREAM_INTERNAL_URL: "http://stream-server:6080"
      RUNNER_API_INTERNAL_URL: "http://app:8000/api/internal/runner"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      stream-server:
        condition: service_started

  # ── Scheduler ──
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - puppetflow-framework:/app/storage
      - puppetflow-execution:/app/data/execution
      - puppetflow-uploads:/app/data/storage
    env_file:
      - .env
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ── Mailbox SMTP Server ──
  mailbox-smtp:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "mailbox:serve", "--port=2525"]
    ports:
      - "${MAILBOX_SMTP_PORT:-2525}:2525"
    volumes:
      - puppetflow-framework:/app/storage
      - puppetflow-execution:/app/data/execution
      - puppetflow-uploads:/app/data/storage
    env_file:
      - .env
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ── Browser Stream Server ──
  stream-server:
    build:
      context: .
      dockerfile: Dockerfile.stream-server
      target: prod
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BROWSER_STREAM_BIND_ADDRESS:-0.0.0.0}:${BROWSER_STREAM_PUBLIC_PORT:-6080}:6080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Shared volume initialization ──
  init-volumes:
    image: busybox
    volumes:
      - puppetflow-framework:/framework
      - puppetflow-execution:/execution
      - puppetflow-uploads:/uploads
    command: ["sh", "-c", "touch /framework/database.sqlite && chown -R 33:33 /framework /execution /uploads"]
    restart: "no"

  # ── Pinokio (Chromium gateway) ──
  pinokio:
    build:
      context: ../pinokio
    restart: unless-stopped
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    shm_size: "1gb"
    volumes:
      - puppetflow-execution:/app/data/execution
    environment:
      TOKEN: "${PINOKIO_TOKEN:-}"

  # ── Redis ──
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ] && [ "$${REDIS_PASSWORD}" != "null" ]; then
          exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --save "" --appendonly no
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != \"null\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  puppetflow-framework:
  puppetflow-uploads:
  puppetflow-execution:
